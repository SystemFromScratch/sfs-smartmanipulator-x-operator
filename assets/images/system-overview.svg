<path class="g" d="M596 196 L404 196"/>
<text class="s" x="500" y="188" text-anchor="middle">/joint_states · /tf</text>
<path class="o" d="M404 230 L596 264"/>
<text class="s" x="500" y="274" text-anchor="middle">FollowJointTrajectory</text>
<text class="s" x="500" y="290" text-anchor="middle">arm + gripper</text>
<path class="l" d="M780 320 L780 370"/>
<text class="s" x="792" y="342" text-anchor="start">USB · DYNAMIXEL Protocol 2.0</text>
<rect class="kit" x="300" y="370" width="680" height="70" rx="8"/>
<text class="h" x="316" y="396" text-anchor="start">SmartFusion2 controller · M2S Hello FPGA Kit</text>
<text class="t" x="316" y="420" text-anchor="start">Zephyr firmware: virtual DYNAMIXEL devices · IDs 1–6 stepper axes · ID 7 gripper</text>
<path class="l" d="M460 440 L460 480"/>
<text class="s" x="472" y="464" text-anchor="start">SPI</text>
<path class="l" d="M820 440 L820 480"/>
