<text class="m" x="610" y="191" text-anchor="start">joint_state_broadcaster</text>
<text class="s" x="610" y="211" text-anchor="start">/joint_states</text>
<rect class="rnode" x="596" y="236" width="368" height="56" rx="8"/>
<text class="m" x="610" y="259" text-anchor="start">ros2_control_node</text>
