<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" aria-label="SmartManipulator-X with the Operator PC: MoveIt 2 and RViz2 send trajectories over ROS 2 DDS to the Robot PC, which drives the SmartFusion2 controller, the stepper drivers, the gripper servo and the Moveo arm" font-family="Inter, Segoe UI, DejaVu Sans, Arial, sans-serif" font-size="13">
<title>SmartManipulator-X with the Operator PC: MoveIt 2 and RViz2 send trajectories over ROS 2 DDS to the Robot PC, which drives the SmartFusion2 controller, the stepper drivers, the gripper servo and the Moveo arm</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3c4043"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#188038"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b06000"/></marker></defs><style>.pc{fill:#f1f3f4;stroke:#5f6368;stroke-width:1.5}.op{fill:#e8f0fe;stroke:#1a73e8;stroke-width:2}.node{fill:#fff;stroke:#1a73e8;stroke-width:1.5}.rnode{fill:#fff;stroke:#5f6368;stroke-width:1.2}.kit{fill:#e6f4ea;stroke:#188038;stroke-width:1.5}.drv{fill:#fef7e0;stroke:#b06000;stroke-width:1.5}.mech{fill:#fce8e6;stroke:#c5221f;stroke-width:1.5}.h{font-weight:700;font-size:15px;fill:#202124}.m{font-family:'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace;font-weight:700;font-size:13px;fill:#202124}.t{fill:#202124}.s{fill:#5f6368;font-size:12px}.tag{fill:#1a73e8;font-size:11px;font-weight:700;letter-spacing:.06em}.l{stroke:#3c4043;stroke-width:2;fill:none;marker-end:url(#a)}.g{stroke:#188038;stroke-width:2;fill:none;marker-end:url(#ag)}.o{stroke:#b06000;stroke-width:2;fill:none;marker-end:url(#ao)}</style>
<rect width="1000" height="610" rx="12" fill="#fff"/>
<rect class="op" x="20" y="20" width="400" height="300" rx="8"/>
<text class="tag" x="36" y="42" text-anchor="start">THIS REPOSITORY</text>
<text class="h" x="36" y="64" text-anchor="start">Operator PC</text>
