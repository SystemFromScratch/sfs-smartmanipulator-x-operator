<rect class="drv" x="300" y="480" width="320" height="50" rx="8"/>
<text class="h" x="316" y="510" text-anchor="start">6× TMC5160T Pro stepper drivers</text>
<rect class="drv" x="660" y="480" width="320" height="50" rx="8"/>
<text class="h" x="676" y="510" text-anchor="start">MG996R gripper servo</text>
<path class="l" d="M460 530 L460 550"/>
<path class="l" d="M820 530 L820 550"/>
<rect class="mech" x="300" y="550" width="680" height="44" rx="8"/>
<text class="h" x="316" y="577" text-anchor="start">BCN3D Moveo mechanics</text>
<text class="s" x="502" y="577" text-anchor="start">J1 base · J2 shoulder · J3 elbow · J4 forearm roll · J5 wrist · gripper</text>
<text class="s" x="30" y="400" text-anchor="start">The Operator PC has no hardware</text>
<text class="s" x="30" y="418" text-anchor="start">connection: no USB device, no</text>
<text class="s" x="30" y="436" text-anchor="start">ros2_control, no motor access.</text>
