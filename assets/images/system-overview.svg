<rect class="node" x="36" y="176" width="368" height="72" rx="8"/>
<text class="m" x="50" y="199" text-anchor="start">move_group</text>
<text class="s" x="50" y="219" text-anchor="start">OMPL planner · pick_ik (position only)</text>
<text class="s" x="50" y="237" text-anchor="start">planning scene · MoveItSimpleControllerManager</text>
<rect class="node" x="36" y="266" width="368" height="40" rx="8"/>
<text class="m" x="50" y="291" text-anchor="start">smartmanipulator_x_moveit_config</text>
<path class="l" d="M220 156 L220 176"/>
<path class="l" d="M220 266 L220 248"/>
<rect class="pc" x="580" y="20" width="400" height="300" rx="8"/>
<text class="tag" x="596" y="42" text-anchor="start">SFS-SMARTMANIPULATOR-X-ROBOT</text>
<text class="h" x="596" y="64" text-anchor="start">Robot PC</text>
<text class="s" x="596" y="84" text-anchor="start">ROS 2 Jazzy in Docker · 10.77.0.10 · owns the USB link</text>
<rect class="rnode" x="596" y="100" width="368" height="56" rx="8"/>
<text class="m" x="610" y="123" text-anchor="start">robot_state_publisher</text>
<text class="s" x="610" y="143" text-anchor="start">/robot_description · /tf</text>
